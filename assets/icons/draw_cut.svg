<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- 左半块 (浅黄) -->
  <polygon points="3,6 10,5 10,19 3,18"
           fill="#f3dfaa" stroke="#2c3e50" stroke-width="1.4"
           stroke-linejoin="round"/>
  <!-- 右半块 (更深, 表示被切开) -->
  <polygon points="14,5 21,6 21,18 14,19"
           fill="#ead49a" stroke="#2c3e50" stroke-width="1.4"
           stroke-linejoin="round"/>
  <!-- 红色切割折线 (贯穿两端) -->
  <polyline points="1,10 8,13 12,8 16,14 23,11"
            fill="none" stroke="#c0392b" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
</svg>
