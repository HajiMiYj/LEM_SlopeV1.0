<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- 土层面 (不规则多边形, 内部有纹理线) -->
  <polygon points="5,9 11,5 19,7 21,15 13,20 4,17"
           fill="#f3dfaa" stroke="#2c3e50" stroke-width="1.6"
           stroke-linejoin="round"/>
  <line x1="7"  y1="13" x2="12" y2="9"  stroke="#d4b76a" stroke-width="0.7"/>
  <line x1="9"  y1="16" x2="16" y2="11" stroke="#d4b76a" stroke-width="0.7"/>
  <line x1="13" y1="18" x2="18" y2="14" stroke="#d4b76a" stroke-width="0.7"/>
  <!-- 6 个顶点: 蓝底白边圆点 -->
  <circle cx="5"  cy="9"  r="1.6" fill="#3498db" stroke="#ffffff" stroke-width="0.7"/>
  <circle cx="11" cy="5"  r="1.6" fill="#3498db" stroke="#ffffff" stroke-width="0.7"/>
  <circle cx="19" cy="7"  r="1.6" fill="#3498db" stroke="#ffffff" stroke-width="0.7"/>
  <circle cx="21" cy="15" r="1.6" fill="#3498db" stroke="#ffffff" stroke-width="0.7"/>
  <circle cx="13" cy="20" r="1.6" fill="#3498db" stroke="#ffffff" stroke-width="0.7"/>
  <circle cx="4"  cy="17" r="1.6" fill="#3498db" stroke="#ffffff" stroke-width="0.7"/>
</svg>
