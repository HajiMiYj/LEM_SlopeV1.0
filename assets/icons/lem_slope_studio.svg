<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="soilGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="rockGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>

  <rect x="24" y="24" width="464" height="464" rx="96" fill="url(#bgGrad)" stroke="#334155" stroke-width="8"/>
  <line x1="56" y1="416" x2="456" y2="416" stroke="#475569" stroke-width="8" stroke-linecap="round"/>

  <!-- 下卧基岩层 -->
  <polygon points="64,416 64,280 200,280 320,360 448,360 448,416" fill="url(#rockGrad)" stroke="#475569" stroke-width="4"/>
  <!-- 上覆土层 -->
  <polygon points="64,280 64,120 200,120 340,310 448,310 448,360 320,360 200,280" fill="url(#soilGrad)" stroke="#92400e" stroke-width="4"/>

  <!-- 地表折线主轮廓 -->
  <polyline points="64,120 200,120 340,310 448,310" fill="none" stroke="#f8fafc" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 离散条分虚线 -->
  <line x1="150" y1="120" x2="150" y2="350" stroke="#fef3c7" stroke-width="4" stroke-dasharray="8,6" opacity="0.8"/>
  <line x1="200" y1="120" x2="200" y2="380" stroke="#fef3c7" stroke-width="4" stroke-dasharray="8,6" opacity="0.8"/>
  <line x1="250" y1="188" x2="250" y2="395" stroke="#fef3c7" stroke-width="4" stroke-dasharray="8,6" opacity="0.8"/>
  <line x1="300" y1="256" x2="300" y2="390" stroke="#fef3c7" stroke-width="4" stroke-dasharray="8,6" opacity="0.8"/>

  <!-- 临界剪切滑弧 -->
  <path d="M 120,120 Q 220,440 390,310" fill="none" stroke="#ef4444" stroke-width="16" stroke-linecap="round"/>
  <polygon points="380,285 418,312 375,335" fill="#ef4444"/>

  <!-- 圆心标示 -->
  <circle cx="270" cy="80" r="18" fill="#38bdf8"/>
  <line x1="270" y1="50" x2="270" y2="110" stroke="#bae6fd" stroke-width="6" stroke-linecap="round"/>
  <line x1="240" y1="80" x2="300" y2="80" stroke="#bae6fd" stroke-width="6" stroke-linecap="round"/>
  <line x1="270" y1="80" x2="230" y2="385" stroke="#38bdf8" stroke-width="4" stroke-dasharray="6,6" opacity="0.6"/>

  <text x="72" y="465" font-family="Arial, sans-serif" font-weight="900" font-size="36" fill="#94a3b8" letter-spacing="4">LEM SLOPE</text>
</svg>
